<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Slate Gradient -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Electric Blue Gradient for "V" -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Titanium White/Silver Gradient for "P" -->
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Outer Rim Accent Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#logoBg)" stroke="#27272A" stroke-width="1.5" />

  <!-- Refined Ambient Rim -->
  <rect x="9.5" y="9.5" width="101" height="101" rx="24.5" fill="none" stroke="url(#rimGrad)" stroke-width="1.2" />

  <!-- Subtle Inner Grid Watermark -->
  <line x1="20" y1="60" x2="100" y2="60" stroke="#FFFFFF" stroke-opacity="0.04" stroke-dasharray="3 3" />
  <line x1="60" y1="20" x2="60" y2="100" stroke="#FFFFFF" stroke-opacity="0.04" stroke-dasharray="3 3" />

  <!-- Monogram Group -->
  <g filter="url(#glow)">
    <!-- Letter 'V' (Sharp, Dynamic, Electric Blue) -->
    <path
      d="M 26 40 L 43.5 80 L 61 40"
      fill="none"
      stroke="url(#vGrad)"
      stroke-width="8.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letter 'P' (Titanium White, Architecturally Aligned) -->
    <!-- P Stem -->
    <path
      d="M 72 40 L 72 80"
      fill="none"
      stroke="url(#pGrad)"
      stroke-width="8.5"
      stroke-linecap="round"
    />

    <!-- P Head Loop -->
    <path
      d="M 72 40 H 83 C 90.5 40, 94.5 44.5, 94.5 51 C 94.5 57.5, 90.5 62, 83 62 H 72"
      fill="none"
      stroke="url(#pGrad)"
      stroke-width="8.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Active Terminal Accent Dot (Cyan Node) -->
    <circle cx="89" cy="78" r="3.5" fill="#38BDF8" />
  </g>
</svg>
